.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}

.muted{color:var(--ink2)} .small{font-size:12.5px} .tiny{font-size:11.5px}

details{border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:10px}

details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"+";display:inline-block;width:14px;color:var(--ink3);font-weight:400}
details[open]>summary:before{content:"\2212"}
details .body{padding:0 14px 12px}
.gap{border-inline-start:3px solid var(--warn);padding:6px 10px;margin-bottom:8px;background:#fffdf7}
.pc{margin:0;padding-inline-start:18px}

.short{color:var(--red);font-weight:700}

.modal.on{display:flex}
.modal .box{background:#fff;border-radius:6px;padding:18px;width:520px;max-width:100%;max-height:90vh;overflow:auto}

.modal input[type=text],.modal textarea{width:100%}
.editable{cursor:pointer;outline:1px dashed var(--accent);outline-offset:2px}

.qlist{list-style:none;margin:0;padding:0}

/* effective data point = researched value overlaid by user's bank-offer edit */
function dp(bank,fid){
  const base=bank.fields[fid]||{value_en:"",value_ar:"",status:"unknown",rating:5};
  const o=(S.overrides[bank.id]||{})[fid];
  if(!o) return base;
  return {value_en:o.value,value_ar:o.value,status:"bank_offer",rating:o.rating,offer_date:o.date,note_en:o.note||"",note_ar:o.note||"",source_url:"",source_title:"",base:base};
}
function scoreBank(bank,st){
  const w=weights(); const out={crit:{},total:0,known:0,n:0};
  let ws=0,acc=0;
  DATA.criteria.forEach(c=>{
    const fs=DATA.fields.filter(f=>f.c===c.id&&f.s.includes(st));
    const rs=fs.map(f=>dp(bank,f.id));
    const sc=rs.length?rs.reduce((a,r)=>a+Number(r.rating),0)/rs.length:5;
    out.crit[c.id]=sc;
    if(c.group==="primary"||w[c.id]>0){rs.forEach(r=>{out.n++;if(r.status==="verified"||r.status==="bank_offer")out.known++;});}
    ws+=w[c.id]; acc+=w[c.id]*sc;
  });
  out.total=ws?acc/ws:0; out.conf=out.n?out.known/out.n:0;
  return out;
}

/* cheque cover model */
function coverModel(){
  const C=S.cover; const periods=[];
  for(let y=2027;y<=2033;y++){periods.push({k:y+"H1",y,h:1});periods.push({k:y+"H2",y,h:2});}
  const due={};
  DATA.schedule.filter(s=>s.kind==="cheque").forEach(s=>{const y=+s.date.slice(0,4);
    if(C.semi){due[y+"H1"]=(due[y+"H1"]||0)+s.amount/2;due[y+"H2"]=(due[y+"H2"]||0)+s.amount/2;}else{due[y+"H2"]=(due[y+"H2"]||0)+s.amount;}});
  let bal=Number(C.opening)||0, cumC=0, cumP=0, shorts=0; const adv=DATA.schedule.find(s=>s.kind==="advance").amount;
  if(C.adv){bal-=adv;} cumP+=adv;
  const rows=periods.map(p=>{
    const coll=Number(C.coll[p.k])||0, out=Number(C.out[p.k])||0, ret=coll*(Number(C.retain)||0)/100;
    const before=bal+ret-out, chq=due[p.k]||0;
    const short=chq>0&&before<chq?chq-before:0; if(short>0)shorts++;
    const needed=chq>0&&(Number(C.retain)||0)>0?Math.max(0,(chq-(bal-out))/((Number(C.retain))/100)):null;
    bal=before-chq; cumC+=coll; cumP+=chq;
    return {p,coll,out,ret,before,chq,after:bal,short,needed,cum35:cumC*0.35,cumP};
  });
  return {rows,shorts,adv};
}
function vCover(){
  const C=S.cover, M=coverModel(), tt=t();

     <td class="r num muted">${fmt(r.cum35)}</td><td class="r num muted">${fmt(r.cumP)}</td></tr>`;});
  h+=`</tbody></table></div><p class="tiny muted" style="margin-top:8px">EGP m. ${tt.timing} ${tt.assumed} ${tt.finalNote}</p>`;

function coverChart(M){
  const rows=M.rows, W=1100, H=210, padL=46, padB=30, padT=10, n=rows.length, bw=(W-padL-10)/n;
  const max=Math.max(1,...rows.map(r=>Math.max(r.before,r.chq))), min=Math.min(0,...rows.map(r=>r.before));
  const sy=v=>padT+(H-padT-padB)*(1-(v-min)/(max-min));
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;direction:ltr" role="img" aria-label="cheque cover timeline"><line x1="${padL}" x2="${W-10}" y1="${sy(0)}" y2="${sy(0)}" stroke="#9aa3ae"/>`;
  [max,max/2].forEach(v=>{g+=`<line x1="${padL}" x2="${W-10}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eef0f3"/><text x="${padL-6}" y="${sy(v)+4}" font-size="10" text-anchor="end" fill="#7a8494">${fmt(v,0)}</text>`;});
  g+=`<text x="${padL-6}" y="${sy(0)+4}" font-size="10" text-anchor="end" fill="#7a8494">0</text>`;
  rows.forEach((r,i)=>{const x=padL+i*bw+bw*0.18, w=bw*0.4;
    const y0=sy(0), yb=sy(r.before);
    g+=`<rect x="${x}" y="${Math.min(y0,yb)}" width="${w}" height="${Math.max(1,Math.abs(yb-y0))}" fill="${r.short>0?"#a32a2a":"#1f4e5f"}" opacity="${r.chq?1:.35}"><title>${r.p.y} H${r.p.h}: ${fmt(r.before)}</title></rect>`;
    if(r.chq){const yc=sy(r.chq);g+=`<line x1="${x-4}" x2="${x+w+bw*0.22}" y1="${yc}" y2="${yc}" stroke="#1b2430" stroke-width="2"/><text x="${x+w+bw*0.24}" y="${yc+3}" font-size="10" fill="#1b2430">${fmt(r.chq,0)}</text>`;}
    g+=`<text x="${x+w/2}" y="${H-12}" font-size="10" text-anchor="middle" fill="#4a5564">${String(r.p.y).slice(2)} H${r.p.h}</text>`;});

const CRC=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0;}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=tb[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};})();
function zip(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;
  files.forEach(f=>{const name=enc.encode(f.name),data=enc.encode(f.text),crc=CRC(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length;});
  const cs=cen.reduce((a,x)=>a+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);

function colName(i){let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
const xe=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
function sheetXml(rows,rtl){let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"${rtl?' rightToLeft="1"':""}/></sheetViews><sheetData>`;
  rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;r.forEach((v,ci)=>{if(v===null||v===undefined||v==="")return;const ref=colName(ci)+(ri+1);
    x+=typeof v==="number"&&isFinite(v)?`<c r="${ref}"${ri===0?' s="1"':""}><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${ri===0?' s="1"':""}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;});x+=`</row>`;});
  return x+`</sheetData></worksheet>`;}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target;
  if(el.dataset.tab){S.tab=el.dataset.tab;render();window.scrollTo(0,0);return;}
  if(el.dataset.s&&el.parentNode.id==="seg-struct"){S.structure=el.dataset.s;render();return;}
  if(el.id==="btn-lang"){S.lang=S.lang==="en"?"ar":"en";render();return;}
  if(el.id==="btn-edit"){S.edit=!S.edit;if(S.edit&&!["banks","compare"].includes(S.tab))S.tab="banks";render();return;}
  if(el.id==="btn-xlsx"){exportXlsx();return;}
  if(el.id==="btn-print"){document.body.classList.remove("printall");window.print();return;}
  if(el.id==="d-printall"){document.body.classList.add("printall");document.querySelectorAll("details").forEach(d=>d.open=true);window.print();return;}
  if(el.id==="w-reset"){S.weights=null;render();return;}
  if(el.dataset.open){S.openBank=el.dataset.open;S.tab="banks";render();const d=document.querySelector(`details[data-bank="${S.openBank}"]`);if(d)d.scrollIntoView({block:"start"});return;}
  if(el.dataset.edit&&S.edit){const [b,f]=el.dataset.edit.split("|");openEdit(b,f);return;}
  if(el.dataset.cv){const [k,v]=el.dataset.cv.split(":");S.cover[k]=v==="1";render();return;}
  if(el.id==="q-export"||el.id==="q-export-all"||el.id==="q-copy"){const cur=document.getElementById("q-bank").value;const bs=el.id==="q-export-all"?DATA.banks:[DATA.banks.find(b=>b.id===cur)];const txt=bs.map(questionsText).join("\n");
    if(el.id==="q-copy"){if(navigator.clipboard)navigator.clipboard.writeText(txt);}else download(el.id==="q-export-all"?"questions-all-banks.txt":"questions-"+cur+".txt",new Blob(["﻿"+txt],{type:"text/plain;charset=utf-8"}));return;}
  if(el.id==="d-export"){exportJson();return;}
  if(el.id==="d-import"){document.getElementById("d-file").click();return;}
  if(el.id==="d-clear"){if(confirm(t().clear+"?")){S.overrides={};render();}return;}
  if(el.id==="modal"){el.classList.remove("on");}
});

  if(el.dataset.w){const w=weights();w[el.dataset.w]=Number(el.value);S.weights=w;document.getElementById("wv-"+el.dataset.w).textContent=el.value;
    /* live re-rank without rebuilding the sliders */
    const tmp=document.createElement("div");tmp.innerHTML=vRank();document.getElementById("rank-table").innerHTML=tmp.querySelector("#rank-table").innerHTML;save();return;}
  if(el.dataset.coll||el.dataset.out){const k=el.dataset.coll||el.dataset.out;S.cover[el.dataset.coll?"coll":"out"][k]=el.value===""?"":Number(el.value);save();return;}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.cmp){const id=el.dataset.cmp;if(el.checked){if(S.compare.length>=3){el.checked=false;return;}S.compare.push(id);}else S.compare=S.compare.filter(x=>x!==id);if(S.tab==="compare")render();else save();return;}
  if(el.dataset.coll||el.dataset.out){setTimeout(()=>{const a=document.activeElement,sel=a&&a.dataset&&(a.dataset.coll?`[data-coll="${a.dataset.coll}"]`:a.dataset.out?`[data-out="${a.dataset.out}"]`:null);
    document.getElementById("cover-out").innerHTML=coverOut(coverModel());if(sel){const n=document.querySelector(sel);if(n){n.focus();n.select();}}},0);return;}
  if(el.dataset.cvn){S.cover[el.dataset.cvn]=Number(el.value)||0;save();document.getElementById("cover-out").innerHTML=coverOut(coverModel());return;}
  if(el.dataset.cvc){S.cover[el.dataset.cvc]=el.checked;save();document.getElementById("cover-out").innerHTML=coverOut(coverModel());return;}
  if(el.dataset.q){S.qdone[el.dataset.q]=el.checked;save();return;}
  if(el.id==="q-bank"){S.qbank=el.value;render();return;}
  if(el.id==="d-file"&&el.files[0]){importJson(el.files[0]);return;}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.bank){if(d.open)S.openBank=d.dataset.bank;else if(S.openBank===d.dataset.bank)S.openBank=null;save();}},true);
window.addEventListener("afterprint",()=>document.body.classList.remove("printall"));
render();
</script>
</body>
</html>
