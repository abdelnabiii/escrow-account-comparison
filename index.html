   {
    "id": "L01",
    "topic_en": "In-force rule: separate project bank account (PM Decree 2184/2022)",
    "topic_ar": "القاعدة السارية: حساب بنكي مستقل للمشروع (قرار رئيس الوزراء 2184 لسنة 2022)",
    "finding_en": "PM Decree 2184 of 16 June 2022 requires the developer to open a separate bank account per project/phase in which all project revenues and expenses are deposited and paid, deposit a size-based financial cover, keep a 5% reserve of collections (or bank guarantee) and file an auditor-certified semi-annual report with the land authority. Art. 10 applies it to all development projects.",
    "finding_ar": "يلزم قرار رئيس مجلس الوزراء رقم 2184 الصادر في 16 يونيو 2022 المطوّر بفتح حساب بنكي مستقل لكل مشروع/مرحلة تودع فيه وتصرف منه كل إيرادات ومصروفات المشروع، وإيداع غطاء مالي بحسب حجم المشروع، والاحتفاظ باحتياطي 5% من التحصيلات (أو خطاب ضمان)، وتقديم تقرير مالي نصف سنوي معتمد من مراقب الحسابات لجهة الولاية. وتسري أحكامه (م 10) على كافة مشروعات التطوير العقاري.",

  "legal_summary_en": "As of 25 November 2026 no Egyptian statute or CBE regulation imposing a true escrow regime on off-plan sales was found. What is in force is Prime Minister's Decree 2184 of 2022, which requires a separate bank account per project or phase for all project revenues and expenses, a size-based financial cover, a 5% collections reserve and semi-annual audited reports to the land authority; press reports say enforcement lagged and NUCA began reviewing developers' bank statements in December 2025. A Housing Ministry draft law creating an Egyptian Real Estate Developers Union would add ring-fenced project accounts with releases against consultant reports and buyer-protection funds; the latest reports found (October 2026) describe it as still being finalised, not yet approved by Cabinet or parliament. Escrow accounts are used in practice by contract, including three reported tripartite accounts for Mostakbal City/MIDAR revenue-share projects at NBE (2018), AAIB (2024) and Banque Misr (2026); whether escrow is defined in Banking Law 194/2020 could not be established, and a law-firm guide states that trusts are not generally recognised in Egypt. Issuing a cheque without funds remains a crime under Art. 534 of Trade Law 17/1999, extinguished by settlement; banks must certify a cheque on the drawer's request when funds exist (Art. 482). No enacted 2024-2026 cheque amendment and no CBE returned-cheque circular could be verified. The CBE overnight lending rate is 21.0% and the deposit rate 20.0% after a 100 bps rise at the late-October 2026 MPC meeting; the next meeting is 17 December 2026. InstaPay limits are reported as EGP 70,000 per transaction, 120,000 per day and 400,000 per month (July 2026).",
  "legal_summary_ar": "حتى 25 نوفمبر 2026 لم يُعثر على قانون مصري أو تعليمات من البنك المركزي تفرض نظام حساب ضمان (إسكرو) حقيقياً على البيع على الخريطة. الساري هو قرار رئيس مجلس الوزراء رقم 2184 لسنة 2022 الذي يلزم بحساب بنكي مستقل لكل مشروع أو مرحلة لكل إيرادات ومصروفات المشروع، وغطاء مالي بحسب الحجم، واحتياطي 5% من التحصيلات، وتقارير نصف سنوية معتمدة لجهة الولاية؛ وتذكر الصحافة أن التطبيق تأخر وأن هيئة المجتمعات العمرانية بدأت مراجعة كشوف حسابات المطورين في ديسمبر 2025. وهناك مشروع قانون من وزارة الإسكان لإنشاء الاتحاد المصري للمطورين العقاريين يضيف حسابات مشروع محمية يُصرف منها وفق تقارير استشارية وصناديق لحماية العملاء؛ وآخر التقارير (أكتوبر 2026) تصفه بأنه ما زال قيد الانتهاء ولم يقره مجلس الوزراء أو البرلمان. تُستخدم حسابات الضمان عملياً على أساس تعاقدي، ومنها ثلاثة حسابات ثلاثية معلنة لمشروعات مشاركة في الإيراد بمدينة المستقبل/ميدار لدى البنك الأهلي (2018) والعربي الأفريقي (2024) وبنك مصر (2026)؛ وتعذر إثبات ورود تعريف للإسكرو في قانون 194 لسنة 2020، ويذكر دليل لمكتب محاماة أن الترست غير معترف به عموماً في مصر. إصدار شيك بدون رصيد ما زال جريمة وفق المادة 534 من قانون التجارة 17 لسنة 1999 وتنقضي الدعوى بالصلح؛ ولا يجوز للبنك رفض اعتماد الشيك بطلب الساحب متى وُجد الرصيد (م 482). لم يمكن التحقق من تعديل صادر للشيكات خلال 2024-2026 ولا من تعليمات البنك المركزي بشأن الشيكات المرتدة. سعر الإقراض لليلة واحدة لدى البنك المركزي 21.0% والإيداع 20.0% بعد رفع 100 نقطة أساس في اجتماع أواخر أكتوبر 2026؛ والاجتماع القادم 17 ديسمبر 2026. حدود إنستاباي المعلنة 70,000 جنيه للمعاملة و120,000 يومياً و400,000 شهرياً (يوليو 2026).",

<style>
:root{
  --ink:#1b2430; --ink2:#4a5564; --ink3:#7a8494; --line:#dfe3e8; --line2:#eef0f3;
  --bg:#f6f7f8; --card:#ffffff; --accent:#1f4e5f; --accent-soft:#e6eef1;
  --ok:#2e6b4a; --ok-bg:#e7f1eb; --warn:#8a5a0b; --warn-bg:#f8efdc;
  --unk:#5d6673; --unk-bg:#eceef1; --offer:#2a4f8f; --offer-bg:#e6ecf7;
  --red:#a32a2a; --red-bg:#f9e6e6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
html[lang=ar] body{font-family:"Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.7}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
h1{font-size:20px} h2{font-size:17px;margin-bottom:10px} h3{font-size:14.5px;margin-bottom:6px} h4{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
html[lang=ar] h4{letter-spacing:0}
p{margin:0 0 8px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding-top:16px;padding-bottom:12px;flex-wrap:wrap}
.top .sub{color:var(--ink2);font-size:13px;margin-top:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:4px;cursor:pointer}
button:hover{border-color:var(--ink3)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button.on{background:var(--accent);color:#fff}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 12px;color:var(--ink2);white-space:nowrap;background:none}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;background:none}
main{padding:18px 0 60px}
section.view{display:none}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.muted{color:var(--ink2)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
table{border-collapse:collapse;width:100%}
th,td{text-align:start;padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:600;border-bottom:1px solid var(--line);background:#fafbfc}
td.r,th.r{text-align:end}
.tablewrap{overflow-x:auto}
.badge{display:inline-block;font-size:11px;line-height:1.5;padding:0 6px;border-radius:3px;border:1px solid transparent;white-space:nowrap;font-weight:600}
.b-verified{color:var(--ok);background:var(--ok-bg)}
.b-bank_to_confirm{color:var(--warn);background:var(--warn-bg)}
.b-unknown{color:var(--unk);background:var(--unk-bg)}
.b-bank_offer{color:var(--offer);background:var(--offer-bg)}
.flag{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--red);color:var(--red);font-weight:600;white-space:nowrap}
.flag.soft{border-color:var(--warn);color:var(--warn)}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.score{font-weight:700;font-size:15px}
.sliders{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:900px){.sliders{grid-template-columns:1fr 1fr}}
.sliders label{display:block;font-size:12.5px;color:var(--ink2)}
.sliders input[type=range]{width:100%;accent-color:var(--accent)}
.sliders .w{font-weight:700;color:var(--ink)}
.bankcard h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:grid;grid-template-columns:minmax(150px,220px) 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);align-items:start}
.field:last-child{border-bottom:0}
.field .lab{color:var(--ink2);font-size:13px}
.field .val .note{color:var(--ink3);font-size:12px}
.field .meta{text-align:end;white-space:nowrap;font-size:12px}
.field .src{font-size:11.5px;color:var(--ink3);word-break:break-word}
.rate{display:inline-block;min-width:26px;text-align:center;font-weight:700;border:1px solid var(--line);border-radius:3px;font-size:12px;margin-inline-start:6px}
@media(max-width:700px){.field{grid-template-columns:1fr}.field .meta{text-align:start}}
details{border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:10px}
details>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"+";display:inline-block;width:14px;color:var(--ink3);font-weight:400}
details[open]>summary:before{content:"\2212"}
details .body{padding:0 14px 12px}
.gap{border-inline-start:3px solid var(--warn);padding:6px 10px;margin-bottom:8px;background:#fffdf7}
.pc{margin:0;padding-inline-start:18px}
.pc li{margin-bottom:4px}
.rec{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 4px 4px 0}
input[type=number],input[type=text],input[type=date],textarea,select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:5px 7px;background:#fff;color:var(--ink);max-width:100%}
input.n{width:84px;text-align:end;direction:ltr}
.short{color:var(--red);font-weight:700}
tr.shortrow td{background:var(--red-bg)}
.modal{position:fixed;inset:0;background:rgba(20,28,38,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:6px;padding:18px;width:520px;max-width:100%;max-height:90vh;overflow:auto}
.modal label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 3px}
.modal input[type=text],.modal textarea{width:100%}
.editable{cursor:pointer;outline:1px dashed var(--accent);outline-offset:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2)}
.kpi{display:flex;gap:24px;flex-wrap:wrap}
.kpi div b{display:block;font-size:20px}
.printonly{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;font-size:10.5px}
  nav.tabs,.tools,.noprint,button{display:none !important}
  section.view{display:none !important}
  body.printall section.view.p{display:block !important;page-break-after:always}
  body:not(.printall) section.view.on{display:block !important}
  .card,details{border-color:#bbb;break-inside:avoid}
  details{break-inside:auto}
  details .body{display:block}
  .printonly{display:block}
  a{color:#000;text-decoration:none}
  .wrap{max-width:none;padding:0}
  .field{break-inside:avoid}
  nav.tabs{position:static}
}
</style>
</head>

function load(){try{const j=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(j)return Object.assign({},def,j,{cover:Object.assign({},def.cover,j.cover||{}),edit:false});}catch(e){}return JSON.parse(JSON.stringify(def));}

/* effective data point = researched value overlaid by user's bank-offer edit */
function dp(bank,fid){
  const base=bank.fields[fid]||{value_en:"",value_ar:"",status:"unknown",rating:5};
  const o=(S.overrides[bank.id]||{})[fid];
  if(!o) return base;
  return {value_en:o.value,value_ar:o.value,status:"bank_offer",rating:o.rating,offer_date:o.date,note_en:o.note||"",note_ar:o.note||"",source_url:"",source_title:"",base:base};
}
function scoreBank(bank,st){
  const w=weights(); const out={crit:{},total:0,known:0,n:0};
  let ws=0,acc=0;
  DATA.criteria.forEach(c=>{
    const fs=DATA.fields.filter(f=>f.c===c.id&&f.s.includes(st));
    const rs=fs.map(f=>dp(bank,f.id));
    const sc=rs.length?rs.reduce((a,r)=>a+Number(r.rating),0)/rs.length:5;
    out.crit[c.id]=sc;
    if(c.group==="primary"||w[c.id]>0){rs.forEach(r=>{out.n++;if(r.status==="verified"||r.status==="bank_offer")out.known++;});}
    ws+=w[c.id]; acc+=w[c.id]*sc;
  });
  out.total=ws?acc/ws:0; out.conf=out.n?out.known/out.n:0;
  return out;
}
function ranked(st){return DATA.banks.map(b=>({b,s:scoreBank(b,st)})).sort((x,y)=>y.s.total-x.s.total);}
const bname=b=>S.lang==="ar"?(b.name_ar||b.name_en):b.name_en;
function flagsHtml(b){let h="";
  if(b.flags&&b.flags.neutrality) h+=`<span class="flag" title="${esc(tx(b.flags.neutrality))}">${t().neutrality}</span> `;
  if(b.flags&&b.flags.link) h+=`<span class="flag soft" title="${esc(tx(b.flags.link))}">${t().related}</span> `;
  if(b.flags&&b.flags.conflict) h+=`<span class="flag soft" title="${esc(tx(b.flags.conflict))}">${t().conflict}</span>`;
  return h;}
const badge=s=>`<span class="badge b-${s}">${t().status[s]||s}</span>`;
function srcHtml(d){
  if(d.status==="bank_offer") return `<span class="src">${t().offerDate} <span class="num">${esc(d.offer_date||"")}</span></span>`;
  if(!d.source_url) return "";
  return `<span class="src"><a href="${esc(d.source_url)}" target="_blank" rel="noopener">${esc(d.source_title||d.source_url)}</a> · ${t().accessed} <span class="num">${esc(d.accessed||"")}</span></span>`;}
function fieldRow(bank,f,st){
  const d=dp(bank,f.id); const applies=!st||f.s.includes(st);
  const v=S.lang==="ar"?(d.value_ar||d.value_en):d.value_en; const n=S.lang==="ar"?(d.note_ar||d.note_en):d.note_en;
  return `<div class="field"><div class="lab">${esc(tx(f.label))}${applies?"":`<div class="tiny muted">${t().notApplicable}</div>`}</div>
   <div class="val"><span class="${S.edit?"editable":""}" data-edit="${bank.id}|${f.id}">${v?esc(v):"&mdash;"}</span>${n?`<div class="note">${esc(n)}</div>`:""}<div>${srcHtml(d)}</div></div>
   <div class="meta">${badge(d.status)}${f.c!=="flag"?`<span class="rate num">${fmt(d.rating,0)}</span>`:""}</div></div>`;}

/* cheque cover model */
function coverModel(){
  const C=S.cover; const periods=[];
  for(let y=2027;y<=2033;y++){periods.push({k:y+"H1",y,h:1});periods.push({k:y+"H2",y,h:2});}
  const due={};
  DATA.schedule.filter(s=>s.kind==="cheque").forEach(s=>{const y=+s.date.slice(0,4);
    if(C.semi){due[y+"H1"]=(due[y+"H1"]||0)+s.amount/2;due[y+"H2"]=(due[y+"H2"]||0)+s.amount/2;}else{due[y+"H2"]=(due[y+"H2"]||0)+s.amount;}});
  let bal=Number(C.opening)||0, cumC=0, cumP=0, shorts=0; const adv=DATA.schedule.find(s=>s.kind==="advance").amount;
  if(C.adv){bal-=adv;} cumP+=adv;
  const rows=periods.map(p=>{
    const coll=Number(C.coll[p.k])||0, out=Number(C.out[p.k])||0, ret=coll*(Number(C.retain)||0)/100;
    const before=bal+ret-out, chq=due[p.k]||0;
    const short=chq>0&&before<chq?chq-before:0; if(short>0)shorts++;
    const needed=chq>0&&(Number(C.retain)||0)>0?Math.max(0,(chq-(bal-out))/((Number(C.retain))/100)):null;
    bal=before-chq; cumC+=coll; cumP+=chq;
    return {p,coll,out,ret,before,chq,after:bal,short,needed,cum35:cumC*0.35,cumP};
  });
  return {rows,shorts,adv};
}

function coverChart(M){

  g+=`<text x="${padL-6}" y="${sy(0)+4}" font-size="10" text-anchor="end" fill="#7a8494">0</text>`;

    g+=`<text x="${x+w/2}" y="${H-12}" font-size="10" text-anchor="middle" fill="#4a5564">${String(r.p.y).slice(2)} H${r.p.h}</text>`;});

    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length;});
  const cs=cen.reduce((a,x)=>a+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);

const xe=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
function sheetXml(rows,rtl){let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"${rtl?' rightToLeft="1"':""}/></sheetViews><sheetData>`;
  rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;r.forEach((v,ci)=>{if(v===null||v===undefined||v==="")return;const ref=colName(ci)+(ri+1);
    x+=typeof v==="number"&&isFinite(v)?`<c r="${ref}"${ri===0?' s="1"':""}><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${ri===0?' s="1"':""}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;});x+=`</row>`;});
  return x+`</sheetData></worksheet>`;}
function exportXlsx(){
  const st=S.structure, rk=ranked(st), tt=t(), rtl=S.lang==="ar"; const r1=n=>Math.round(n*10)/10;
  const sh=[];
  sh.push({name:"Ranking",rows:[[tt.rank,tt.bank,tt.structure,tt.total,...DATA.criteria.map(c=>tx(c.label)),tt.conf+" %",tt.neutrality,tt.related+" / "+tt.conflict],
    ...rk.map((r,i)=>[i+1,bname(r.b),st,r1(r.s.total),...DATA.criteria.map(c=>r1(r.s.crit[c.id])),Math.round(r.s.conf*100),r.b.flags&&r.b.flags.neutrality?tx(r.b.flags.neutrality):"",[r.b.flags&&r.b.flags.link?tx(r.b.flags.link):"",r.b.flags&&r.b.flags.conflict?tx(r.b.flags.conflict):""].filter(Boolean).join(" | ")])]});
  const rowsD=[[tt.bank,tt.criterion,tt.field,"A/B",tt.value,"Status",tt.rating,tt.note,tt.source,"URL",tt.accessed+" / "+tt.offerDate]];
  rk.forEach(r=>DATA.fields.forEach(f=>{const d=dp(r.b,f.id);rowsD.push([bname(r.b),tx(crit(f.c).label),tx(f.label),f.s.join("+"),rtl?(d.value_ar||d.value_en):d.value_en,tt.status[d.status],Number(d.rating),rtl?(d.note_ar||d.note_en||""):(d.note_en||""),d.source_title||"",d.source_url||"",d.status==="bank_offer"?d.offer_date:(d.accessed||"")]);}));
  sh.push({name:"Data",rows:rowsD});
  const fl=DATA.fields; sh.push({name:"Matrix",rows:[[tt.field,...rk.map(r=>bname(r.b))],...fl.map(f=>[tx(f.label),...rk.map(r=>{const d=dp(r.b,f.id);const v=rtl?(d.value_ar||d.value_en):d.value_en;return (v||"-")+" ["+tt.status[d.status]+"]";})])]});
  const M=coverModel(); sh.push({name:"Cheque cover",rows:[[tt.period,tt.collections,tt.otherOut,tt.retained,tt.before,tt.cheque,tt.shortfall,tt.after,tt.needed,tt.cum35,tt.cumPaid],...M.rows.map(r=>[r.p.y+" H"+r.p.h,r.coll,r.out,r1(r.ret),r1(r.before),r.chq,r1(r.short),r1(r.after),r.needed==null?"":r1(r.needed),r1(r.cum35),r.cumP])]});
  sh.push({name:"Structures",rows:[[tt.clause,tt.requirement,tx(DATA.structures.A.name),tx(DATA.structures.B.name)],...DATA.clauses.map(c=>[c.id,tx(c.req),tx(c.A),tx(c.B)]),[],[tt.gaps],...DATA.gaps.map((g,i)=>[i+1,tx(g)])]});
  sh.push({name:"Open fields",rows:[[tt.bank,tt.field,"Status",tt.qTitle],...["unknown","bank_to_confirm"].flatMap(s=>statusList(s).map(x=>[bname(x.b),tx(x.f.label),tt.status[s],tx(x.f.q)]))]});
  sh.push({name:"Legal",rows:[[tt.legalTitle],[rtl?(DATA.legal.legal_summary_ar||DATA.legal.legal_summary_en):DATA.legal.legal_summary_en],[],["Topic","Finding","Position","Status",tt.asof,"URL"],...(DATA.legal.legal_items||[]).map(i=>[rtl?(i.topic_ar||i.topic_en):i.topic_en,rtl?(i.finding_ar||i.finding_en):i.finding_en,i.position,i.status,i.as_of||"",(i.sources||[]).map(s=>s.url).join(" ")]),[],[tt.shareTitle],...(DATA.legal.sabbour_shareholders||[]).map(r=>[r.holder_en,r.stake,r.status,r.as_of||"",(r.sources||[]).map(s=>s.url).join(" ")])]});
  const files=[{name:"[Content_Types].xml",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sh.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
   {name:"_rels/.rels",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
   {name:"xl/workbook.xml",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sh.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
   {name:"xl/_rels/workbook.xml.rels",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sh.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sh.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
   {name:"xl/styles.xml",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
   ...sh.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,text:sheetXml(s.rows,rtl)}))];
  download("escrow-bank-comparison.xlsx",zip(files));
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target;
  if(el.dataset.tab){S.tab=el.dataset.tab;render();window.scrollTo(0,0);return;}
  if(el.dataset.s&&el.parentNode.id==="seg-struct"){S.structure=el.dataset.s;render();return;}
  if(el.id==="btn-lang"){S.lang=S.lang==="en"?"ar":"en";render();return;}
  if(el.id==="btn-edit"){S.edit=!S.edit;if(S.edit&&!["banks","compare"].includes(S.tab))S.tab="banks";render();return;}
  if(el.id==="btn-xlsx"){exportXlsx();return;}
  if(el.id==="btn-print"){document.body.classList.remove("printall");window.print();return;}
  if(el.id==="d-printall"){document.body.classList.add("printall");document.querySelectorAll("details").forEach(d=>d.open=true);window.print();return;}
  if(el.id==="w-reset"){S.weights=null;render();return;}
  if(el.dataset.open){S.openBank=el.dataset.open;S.tab="banks";render();const d=document.querySelector(`details[data-bank="${S.openBank}"]`);if(d)d.scrollIntoView({block:"start"});return;}
  if(el.dataset.edit&&S.edit){const [b,f]=el.dataset.edit.split("|");openEdit(b,f);return;}
  if(el.dataset.cv){const [k,v]=el.dataset.cv.split(":");S.cover[k]=v==="1";render();return;}
  if(el.id==="q-export"||el.id==="q-export-all"||el.id==="q-copy"){const cur=document.getElementById("q-bank").value;const bs=el.id==="q-export-all"?DATA.banks:[DATA.banks.find(b=>b.id===cur)];const txt=bs.map(questionsText).join("\n");
    if(el.id==="q-copy"){if(navigator.clipboard)navigator.clipboard.writeText(txt);}else download(el.id==="q-export-all"?"questions-all-banks.txt":"questions-"+cur+".txt",new Blob(["﻿"+txt],{type:"text/plain;charset=utf-8"}));return;}
  if(el.id==="d-export"){exportJson();return;}
  if(el.id==="d-import"){document.getElementById("d-file").click();return;}
  if(el.id==="d-clear"){if(confirm(t().clear+"?")){S.overrides={};render();}return;}
  if(el.id==="modal"){el.classList.remove("on");}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.w){const w=weights();w[el.dataset.w]=Number(el.value);S.weights=w;document.getElementById("wv-"+el.dataset.w).textContent=el.value;
    /* live re-rank without rebuilding the sliders */
    const tmp=document.createElement("div");tmp.innerHTML=vRank();document.getElementById("rank-table").innerHTML=tmp.querySelector("#rank-table").innerHTML;save();return;}
  if(el.dataset.coll||el.dataset.out){const k=el.dataset.coll||el.dataset.out;S.cover[el.dataset.coll?"coll":"out"][k]=el.value===""?"":Number(el.value);save();return;}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.cmp){const id=el.dataset.cmp;if(el.checked){if(S.compare.length>=3){el.checked=false;return;}S.compare.push(id);}else S.compare=S.compare.filter(x=>x!==id);if(S.tab==="compare")render();else save();return;}
  if(el.dataset.coll||el.dataset.out){setTimeout(()=>{const a=document.activeElement,sel=a&&a.dataset&&(a.dataset.coll?`[data-coll="${a.dataset.coll}"]`:a.dataset.out?`[data-out="${a.dataset.out}"]`:null);
    document.getElementById("cover-out").innerHTML=coverOut(coverModel());if(sel){const n=document.querySelector(sel);if(n){n.focus();n.select();}}},0);return;}
  if(el.dataset.cvn){S.cover[el.dataset.cvn]=Number(el.value)||0;save();document.getElementById("cover-out").innerHTML=coverOut(coverModel());return;}
  if(el.dataset.cvc){S.cover[el.dataset.cvc]=el.checked;save();document.getElementById("cover-out").innerHTML=coverOut(coverModel());return;}
  if(el.dataset.q){S.qdone[el.dataset.q]=el.checked;save();return;}
  if(el.id==="q-bank"){S.qbank=el.value;render();return;}
  if(el.id==="d-file"&&el.files[0]){importJson(el.files[0]);return;}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.bank){if(d.open)S.openBank=d.dataset.bank;else if(S.openBank===d.dataset.bank)S.openBank=null;save();}},true);
window.addEventListener("afterprint",()=>document.body.classList.remove("printall"));
render();
</script>
</body>
</html>
